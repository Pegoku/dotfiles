##! Media
bindl= Super+Shift, N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Next track
bindl = , XF86AudioPrev, exec, bash -lc 'playerctl --player=spotify,%any previous || true; quickshell ipc call nowplaying pulse' # [hidden]
bindl = , XF86AudioPlay, exec, bash -lc 'playerctl --player=spotify,%any play-pause || true; quickshell ipc call nowplaying pulse' # [hidden]
bindl = , XF86AudioNext, exec, bash -lc 'playerctl --player=spotify,%any next || playerctl --player=%any position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` || true; quickshell ipc call nowplaying pulse' # [hidden]
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= Super+Shift, B, exec, playerctl previous # Previous track
bindl= Super+Shift, P, exec, playerctl play-pause # Play or pause media

#!
##! Development Apps
#bind = Super, T, exec, # Launch foot (terminal)
#bind = Super, Z, exec, Zed # Launch Zed (editor)
bind = Super, C, exec, code --password-store=gnome --enable-features=UseOzonePlatform --ozone-platform=wayland # Open VSCode
bind = Super, E, exec, nautilus --new-window # Open file manager
# bind = Super+Alt, E, exec, thunar # [hidden]
##! Browsers and Chat
bind = Ctrl+Super, W, exec, brave # Open Brave
bind = Super, W, exec, firefox -P default-release # Open Firefox default-release profile
#bind = Super, X, exec, zapzap
bind = Super, X, exec, /usr/bin/firefoxpwa site launch 01JMMJ9598CX6H41DD4BG93B87 --protocol # Open chat PWA
bind = Ctrl+Super, X, exec, slack # Open Slack
bind = Shift+Super, X, exec, discord # Open Discord
##! Creative and Engineering Apps
#bind = Super, G, exec, env -u WAYLAND_DISPLAY -u QT_QPA_PLATFORM /usr/bin/freecad # Launch FreeCAD
bind = Super, G, exec, env env -u WAYLAND_DISPLAY -u QT_QPA_PLATFORM freecad # Open FreeCAD
# bind = Super, K, exec, bash /usr/share/applications/org.kicad.kicad.desktop
bind = Super, K, exec, kicad # Open KiCad
#bind = Super, K, exec, env XDG_SESSION_TYPE=x11 env GDK_BACKEND=x11 sh -c "flatpak run org.kicad.KiCad" # Launch KiCad
##! System and Launchers
bind = Super, I, exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center # Open Settings
bind = Ctrl+Super, V, exec, pavucontrol # Open volume mixer
# bind = Ctrl+Super+Shift, V, exec, easyeffects # Launch EasyEffects (equalizer & other audio effects)
bind = Ctrl+Shift, Escape, exec, gnome-system-monitor # Open system monitor
#bind = Ctrl+Super, T, exec, pkill anyrun || anyrun # Toggle fallback launcher: anyrun
bind = Ctrl+Super, T, exec, pgrep -x anyrun && pkill -x anyrun || anyrun # Toggle Anyrun
bind = Superm, P, exec, [workspace 10 silent] spotify # Open Spotify on workspace 10

# Set passthrough for some keys to Hyprland
bind = Super,code:197,submap,passthru # [hidden]
submap = passthru
bind = Super,Escape,submap,reset # [hidden]
submap = reset

# Cursed stuff
## Make window not amogus large
bind = Ctrl+Super, Backslash, resizeactive, exact 640 480 # [hidden]

##! Miscellaneous
# Controller
bind = Ctrl+Shift+Alt, C, workspace, 5 # Switch to workspace 5

##! Overview Shortcuts
# Gestures
