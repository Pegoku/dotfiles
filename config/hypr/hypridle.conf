$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = loginctl lock-session

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300 # 5mins
    on-timeout = bash -lc '[ "$(cat "$HOME/.local/state/hypr/caffeine_enabled" 2>/dev/null)" = "1" ] || loginctl lock-session'
}

listener {
    timeout = 1800
    on-timeout = bash -lc '[ "$(cat "$HOME/.local/state/hypr/caffeine_enabled" 2>/dev/null)" = "1" ] || hyprctl dispatch dpms off'
#    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = bash -lc '[ "$(cat "$HOME/.local/state/hypr/caffeine_enabled" 2>/dev/null)" = "1" ] || $suspend_cmd'
}
