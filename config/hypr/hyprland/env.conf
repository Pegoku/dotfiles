
# ############ Themes #############
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_ICON_THEME, breeze-dark
source=~/.config/hypr/hyprland/env.local.conf
# env = QT_STYLE_OVERRIDE,adw-gtk3-dark
#env = QT_STYLE_OVERRIDE,kvantum-dark
# env = WLR_NO_HARDWARE_CURSORS, 1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

env = XDG_CURRENT_DESKTOP,Hyprland

# ######## Screen tearing #########
# env = WLR_DRM_NO_ATOMIC, 1

# ############ Others #############

env = CLUTTER_BACKEND,wayland
env = GTK_THEME,adw-gtk3-dark
#env = GTK2_RC_FILES,/usr/share/themes/AdwaitaDark/gtk-2.0/gtkrc
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
#env = QT_QPA_PLATFORMTHEME,gtk2
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SWT_GTK3,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = ELECTRON_OZONE_PLATFORM_HINT,auto
