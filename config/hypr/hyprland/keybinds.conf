bind = SUPER, Super_L, exec, quickshell ipc call overview toggle # Toggle overview with Super tap
gesture = 3, up, dispatcher, exec, quickshell ipc call overview toggle
gesture = 3, down, dispatcher, exec, quickshell ipc call overview toggle
gesture = 3, horizontal, workspace # [hidden]



