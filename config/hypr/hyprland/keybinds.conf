# Lines ending with `# [hidden]` won't be shown on cheatsheet
# Lines starting with #! are section headings

bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = Super ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = ,XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% # [hidden]
bindl = Super+Shift,M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% # [hidden]
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # [hidden]
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # [hidden]

# Uncomment these if you can't get AGS to work
#bindle=, XF86MonBrightnessUp, exec, brightnessctl set '12.75+'
#bindle=, XF86MonBrightnessDown, exec, brightnessctl set '12.75-'

#!
##! Essentials for beginner

bind = Super, T, exec, foot  # Open terminal
bind = , Super, exec, true # Open app launcher
bind = Ctrl+Super, p, exec, ~/.config/hypr/scripts/color_generation/switchwall.sh # Change wallpaper
##! Capture and Clipboard
bind = Super, V, exec, pkill fuzzel || cliphist list | fuzzel --dmenu | cliphist decode | wl-copy # Open clipboard history
bind = Super, Period, exec, pkill fuzzel || ~/.local/bin/fuzzel-emoji # Pick emoji
bind = Ctrl+Shift+Alt, Delete, exec, pkill wlogout || wlogout -p layer-shell # [hidden]
bind = Super+Shift, S, exec, ~/.config/hypr/scripts/grimblast.sh --freeze copy area # Snip screen area
bind = Super+Shift+Alt, S, exec, grim -g "$(slurp)" - | swappy -f - # Snip and edit screen area
# OCR
bind = Super+Shift,T,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract -l eng "tmp.png" - | wl-copy && rm "tmp.png" # OCR selected area
bind = Ctrl+Super+Shift,S,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract "tmp.png" - | wl-copy && rm "tmp.png" # [hidden]
# Color picker
bind = Super+Shift, C, exec, hyprpicker -a # Pick color
bind = Super+Shift, Z, exec, ~/.config/hypr/scripts/hyprland/toggle_cursor_zoom.sh # Toggle desktop zoom
# Fullscreen screenshot
#bind=, Print, exec, grimshot copy anything # Screenshot >> clipboard
bind=,Print, exec, ~/.config/hypr/scripts/grimblast.sh copysave area ~/Pictures/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png  # Save area screenshot
bind=,XF86Calculator, exec, ~/.config/hypr/scripts/grimblast.sh copysave area ~/Pictures/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png  # Save area screenshot
bind= Ctrl,Print, exec, bash -lc 'f="$HOME/Pictures/Screenshots/Screenshot_$(date +\"%Y-%m-%d_%H.%M.%S\").png"; ~/.config/hypr/scripts/grimblast.sh copysave area "$f" && swappy -f "$f"' # Snip area and edit it
#bind= Ctrl,Print, exec, mkdir -p ~/Pictures/Screenshots && ~/.config/hypr/scripts/grimblast.sh copysave screen ~/Pictures/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file
##! Recording
bind = Super+Alt, R, exec, ~/.config/hypr/scripts/record-script.sh # Record selected area
bind = Ctrl+Alt, R, exec, ~/.config/hypr/scripts/record-script.sh --fullscreen # [hidden] Record screen (no sound)
bind = Super+Shift+Alt, R, exec, ~/.config/hypr/scripts/record-script.sh --fullscreen-sound # Record screen (with sound)
##! Session
bind = Ctrl+Super, L, exec, ags run-js 'lock.lock()' # [hidden]
bind = Super, L, exec, loginctl lock-session # Lock session
bind = Super+Shift, L, exec, loginctl lock-session # [hidden]
bindl = Super+Shift, L, exec, loginctl lock-session # Lock session
bind = Ctrl+Shift+Alt+Super, Delete, exec, systemctl poweroff || loginctl poweroff # [hidden] Power off

#!
##! Window management
# Focusing
#/# bind = Super, ←/↑/→/↓,, # Move focus in direction
bind = Super, Left, movefocus, l # [hidden]
bind = Super, Right, movefocus, r # [hidden]
bind = Super, Up, movefocus, u # [hidden]
bind = Super, Down, movefocus, d # [hidden]
bind = Super, BracketLeft, movefocus, l # [hidden]
bind = Super, BracketRight, movefocus, r # [hidden]
bindm = Super, mouse:272, movewindow # Drag window
bindm = Super, Z , resizewindow # Resize window
bind = Super, Q, killactive, # Close window
bind = Super+Shift+Alt, Q, exec, hyprctl kill # Pick window to kill
##! Window layout
#/# bind = Super+Shift, ←/↑/→/↓,, # Window: move in direction
bind = Super+Shift, Left, movewindow, l # [hidden]
bind = Super+Shift, Right, movewindow, r # [hidden]
bind = Super+Shift, Up, movewindow, u # [hidden]
bind = Super+Shift, Down, movewindow, d # [hidden]
# Window split ratio
#/# binde = Super, +/-,, # Window: split ratio +/- 0.1
binde = Super, Minus, layoutmsg, splitratio -0.1 # [hidden]
binde = Super, Equal, layoutmsg, splitratio +0.1 # [hidden]
binde = Super, Semicolon, layoutmsg, splitratio -0.1 # [hidden]
binde = Super, Apostrophe, layoutmsg, splitratio +0.1 # [hidden]
# Positioning mode
bind = Super+Alt, Space, togglefloating, # Toggle floating mode
bind = Super, F, fullscreen, 0 # Toggle fullscreen
bind = Super, D, fullscreen, 1 # Toggle maximized fullscreen

#!
##! Workspace navigation
# Switching
#/# bind = Super, Hash,, # Focus workspace # (1, 2, 3, 4, ...)
bind = Super, 1, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 1 # [hidden]
bind = Super, 2, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 2 # [hidden]
bind = Super, 3, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 3 # [hidden]
bind = Super, 4, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 4 # [hidden]
bind = Super, 5, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 5 # [hidden]
bind = Super, 6, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 6 # [hidden]
bind = Super, 7, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 7 # [hidden]
bind = Super, 8, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 8 # [hidden]
bind = Super, 9, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 9 # [hidden]
bind = Super, 0, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh workspace 10 # [hidden]

#/# bind = Ctrl+Super, ←/→,, # Workspace: focus left/right
bind = Ctrl+Super, Right, workspace, +1 # [hidden]
bind = Ctrl+Super, Left, workspace, -1 # [hidden]
#/# bind = Super, Scroll ↑/↓,, # Workspace: focus left/right
bind = Super, mouse_up, workspace, +1 # [hidden]
bind = Super, mouse_down, workspace, -1 # [hidden]
bind = Ctrl+Super, mouse_up, workspace, +1 # [hidden]
bind = Ctrl+Super, mouse_down, workspace, -1 # [hidden]
#/# bind = Super, Page_↑/↓,, # Workspace: focus left/right
bind = Super, Page_Down, workspace, +1 # [hidden]
bind = Super, Page_Up, workspace, -1 # [hidden]
bind = Ctrl+Super, Page_Down, workspace, +1 # [hidden]
bind = Ctrl+Super, Page_Up, workspace, -1 # [hidden]
## Special
bind = Super, S, togglespecialworkspace, # Toggle special workspace
bind = Super, mouse:275, togglespecialworkspace, # Toggle special workspace

##! Workspace management
# Move window to workspace Super + Alt + [0-9]
#/# bind = Super+Alt, Hash,, # Window: move to workspace # (1, 2, 3, 4, ...)
bind = Super+Alt, 1, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 1 # [hidden] silent
bind = Super+Alt, 2, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 2 # [hidden]
bind = Super+Alt, 3, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 3 # [hidden]
bind = Super+Alt, 4, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 4 # [hidden]
bind = Super+Alt, 5, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 5 # [hidden]
bind = Super+Alt, 6, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 6 # [hidden]
bind = Super+Alt, 7, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 7 # [hidden]
bind = Super+Alt, 8, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 8 # [hidden]
bind = Super+Alt, 9, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 9 # [hidden]
bind = Super+Alt, 0, exec, ~/.config/hypr/scripts/hyprland/workspace_action.sh movetoworkspace 10 # [hidden]

bind = Ctrl+Super+Shift, Up, movetoworkspacesilent, special # [hidden]

bind = Ctrl+Super+Shift, Right, movetoworkspace, +1 # [hidden]
bind = Ctrl+Super+Shift, Left, movetoworkspace, -1 # [hidden]
bind = Ctrl+Super, BracketLeft, workspace, -1 # [hidden]
bind = Ctrl+Super, BracketRight, workspace, +1 # [hidden]
bind = Ctrl+Super, Up, workspace, -5 # [hidden]
bind = Ctrl+Super, Down, workspace, +5 # [hidden]
#/# bind = Super+Shift, Scroll ↑/↓,, # Window: move to workspace left/right
bind = Super+Shift, mouse_down, movetoworkspace, -1 # [hidden]
bind = Super+Shift, mouse_up, movetoworkspace, +1 # [hidden]
bind = Super+Alt, mouse_down, movetoworkspace, -1 # [hidden]
bind = Super+Alt, mouse_up, movetoworkspace, +1 # [hidden]
#/# bind = Super+Shift, Page_↑/↓,, # Window: move to workspace left/right
bind = Super+Alt, Page_Down, movetoworkspace, +1 # [hidden]
bind = Super+Alt, Page_Up, movetoworkspace, -1 # [hidden]
bind = Super+Shift, Page_Down, movetoworkspace, +1  # [hidden]
bind = Super+Shift, Page_Up, movetoworkspace, -1  # [hidden]
bind = Super+Alt, S, movetoworkspacesilent, special # Move window to special workspace
# bind = Super, P, pin

bind = Ctrl+Super, S, togglespecialworkspace, # [hidden]
bind = Alt, Tab, cyclenext # [hidden] sus keybind
bind = Alt, Tab, bringactivetotop, # [hidden] bring it to the top

#!
##! Shell and Widgets
#bindr = Super, R, exec, rofi -show drun; pkill ydotool; quickshell & # Restart shell widgets
bindr = Ctrl+Super+Alt, R, exec, hyprctl reload; killall quickshell ydotool; quickshell & # Restart quickshell and reload Hyprland
bind = Ctrl+Alt, Slash, exec, ags run-js 'cycleMode();' # Cycle bar mode
bind = SUPER, Tab, exec, quickshell ipc call overview toggle # Toggle overview
bind = Super Shift, H, exec, quickshell ipc call keybinds toggle # Show keybind help
bind = Super, B, exec, quickshell ipc call aichat toggle # Toggle AI chat overlay
bind = Super, A, exec, ags -t 'sideleft' # [hidden]
bind = Super+Shift, O, tagwindow, opaque_toggle # Toggle window opacity
bind = Ctrl+Shift+Super, O, exec, ~/.config/hypr/scripts/toggle-global-opacity.sh # Toggle all windows opacity
bind = Super, O, exec, ags -t 'sideleft' # [hidden]
bind = Super, N, exec, ags -t 'sideright' # Toggle right sidebar
bind = Super, M, exec, ags run-js 'openMusicControls.value = (!mpris.getPlayer() ? false : !openMusicControls.value);' # Toggle music controls
bind = Super, Comma, exec, ags run-js 'openColorScheme.value = true; Utils.timeout(2000, () => openColorScheme.value = false);' # Preview color scheme
bind = Ctrl+Super, K, exec, for ((i=0; i<$(hyprctl monitors -j | jq length); i++)); do ags -t "osk""$i"; done # Toggle on-screen keyboard
bind = Ctrl+Alt, Delete, exec, quickshell ipc call powermenu toggle # Open power menu
bind = , XF86PowerOff, exec, quickshell ipc call powermenu toggle # Open power menu
bind = Ctrl+Super, G, exec, for ((i=0; i<$(hyprctl monitors -j | jq length); i++)); do ags -t "crosshair""$i"; done # Toggle crosshair overlay
bindel = , XF86MonBrightnessUp, exec, bash -lc 'brightnessctl set +5% && quickshell ipc call osd brightness' # [hidden]
bindel = , XF86MonBrightnessDown, exec, bash -lc 'brightnessctl set 5%- && quickshell ipc call osd brightness' # [hidden]
bindl  = , XF86AudioMute, exec, ags run-js 'indicator.popup(1);' # [hidden]
bindl  = Super+Shift,M,   exec, ags run-js 'indicator.popup(1);' # [hidden]

